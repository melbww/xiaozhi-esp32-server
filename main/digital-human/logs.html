<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Logs · xiaozhi digital-human</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --info: #58a6ff;
    --debug: #6e7681;
    --warn: #d29922;
    --error: #f85149;
    --accent: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px; display: flex; flex-direction: column;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f85149; }
  .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .sep { width: 1px; height: 20px; background: var(--border); }
  .group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .group-label { font-size: 11px; color: var(--muted); margin-right: 2px; }
  button, .chip, .tgl {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 9px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  button:hover, .chip:hover, .tgl:hover { border-color: var(--muted); }
  .chip.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .tgl.on { background: #2ea043; border-color: #2ea043; color: #fff; }
  .tgl.on.warn-on { background: #bd561d; border-color: #bd561d; }
  input[type=search] {
    background: #0d1117; border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 3px 8px; font-size: 12px; width: 160px; font-family: inherit;
  }
  input[type=search]:focus { outline: 1px solid var(--info); }
  .stats { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  #log {
    flex: 1; overflow-y: auto; padding: 6px 0;
  }
  .line {
    display: flex; align-items: baseline; gap: 8px;
    padding: 1px 12px; white-space: pre-wrap; word-break: break-all;
    border-bottom: 1px solid rgba(48,54,61,.25);
  }
  .line:hover { background: rgba(255,255,255,.03); }
  .badge-src {
    flex: none; font-size: 10px; padding: 0 6px; border-radius: 3px;
    color: #0d1117; font-weight: 600; min-width: 34px; text-align: center;
  }
  .badge-src.server { background: #58a6ff; }
  .badge-src.runtime { background: #d2a8ff; }
  .badge-lvl {
    flex: none; font-size: 10px; padding: 0 5px; border-radius: 3px; min-width: 38px;
    text-align: center; border: 1px solid transparent;
  }
  .lvl-info { color: var(--info); border-color: rgba(88,166,255,.4); }
  .lvl-debug { color: var(--debug); border-color: rgba(110,118,129,.4); }
  .lvl-warn { color: var(--warn); border-color: rgba(210,153,34,.4); }
  .lvl-error { color: var(--error); border-color: rgba(248,81,73,.5); }
  .badge-stage {
    flex: none; font-size: 10px; padding: 0 5px; border-radius: 3px; min-width: 34px;
    text-align: center; background: #21262d; color: var(--muted);
  }
  .txt { flex: 1; min-width: 0; }
  .txt.trunc { cursor: pointer; }
  .txt.trunc:hover { outline: 1px dashed var(--muted); }
  .txt.trunc.expanded { background: rgba(88,166,255,.06); }
  .txt .hl { background: #d29922; color: #0d1117; border-radius: 2px; padding: 0 1px; }
  .txt.stage-VAD  { color: #79c0ff; }
  .txt.stage-ASR  { color: #7ee787; }
  .txt.stage-ASRRAW { color: #56d364; font-weight: 600; }
  .txt.stage-LLM  { color: #ffa657; }
  .txt.stage-TTS  { color: #d2a8ff; }
  .txt.stage-HTTP { color: #8b949e; }
  .txt.stage-ERROR { color: #f85149; }
  .txt.stage-WARN  { color: #d29922; }
  #empty { color: var(--muted); text-align: center; padding: 40px; font-size: 12px; }
  footer {
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 4px 12px; font-size: 11px; color: var(--muted);
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
<header>
  <h1>📡 Live Logs</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
  <div class="sep"></div>
  <div class="group" id="srcGroup">
    <span class="group-label">源</span>
    <button class="tgl on" data-src="server">server</button>
    <button class="tgl on" data-src="runtime">runtime</button>
  </div>
  <div class="sep"></div>
  <div class="group" id="lvlGroup">
    <span class="group-label">级别</span>
    <button class="tgl on" data-lvl="debug">DEBUG</button>
    <button class="tgl on" data-lvl="info">INFO</button>
    <button class="tgl on" data-lvl="warn">WARN</button>
    <button class="tgl on" data-lvl="error">ERROR</button>
  </div>
  <div class="sep"></div>
  <div class="group" id="stageGroup">
    <span class="group-label">阶段</span>
    <button class="chip on" data-stage="ALL">ALL</button>
    <button class="chip on" data-stage="VAD">VAD</button>
    <button class="chip on" data-stage="ASR">ASR</button>
    <button class="chip on" data-stage="LLM">LLM</button>
    <button class="chip on" data-stage="TTS">TTS</button>
    <button class="chip on" data-stage="HTTP">HTTP</button>
    <button class="chip on" data-stage="MCP">MCP</button>
    <button class="chip on" data-stage="WAKE">WAKE</button>
    <button class="chip on" data-stage="SYS">SYS</button>
  </div>
  <div class="sep"></div>
  <input type="search" id="search" placeholder="🔍 关键字过滤…">
  <button id="pauseBtn">⏸ 暂停</button>
  <button id="clearBtn">🧹 清屏</button>
  <div class="stats" id="stats"></div>
</header>
<div id="log"></div>
<footer>
  <span id="connInfo"></span>
  <span id="hint">提示: 说话后 [VAD]→[ASR]→[ASR][RAW]→[LLM]→[TTS] 会实时出现在这里</span>
</footer>

<script>
(function () {
  "use strict";

  // ---------- 状态 ----------
  const wsUrl = "ws://" + location.host + "/logs-ws";
  const MAX_LINES = 3000;
  const FLUSH_MS = 80;

  const state = {
    ws: null,
    sources: { server: true, runtime: true },
    levels: { debug: true, info: true, warn: true, error: true },
    stages: { ALL: true, VAD: true, ASR: true, LLM: true, TTS: true, HTTP: true, MCP: true, WAKE: true, SYS: true },
    paused: false,
    autoScroll: true,
    search: "",
    total: 0,
    shown: 0,
    pending: [],
    timer: null,
  };

  const logEl = document.getElementById("log");
  const statsEl = document.getElementById("stats");
  const statusEl = document.getElementById("statusText");
  const dotEl = document.getElementById("dot");

  // 视为"贴底"的容差(px): 在这个范围内就认为用户在看最新内容
  const SCROLL_TOLERANCE = 24;
  function isAtBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight <= SCROLL_TOLERANCE;
  }

  // ---------- 阶段识别 ----------
  function classifyStage(line) {
    if (/\[ASR\]\[RAW\]/.test(line)) return "ASRRAW";
    if (/\[VAD\]/.test(line)) return "VAD";
    if (/\[ASR\]|识别文本|识别语言|识别情绪|识别说话人/.test(line)) return "ASR";
    if (/LLM 请求|LLM 响应|LLM 工具调用|大模型收到用户消息|Token 消耗|chat\/completions/.test(line)) return "LLM";
    if (/TTS|语音生成成功|发送音频消息|发送第一段语音/.test(line)) return "TTS";
    if (/HTTP Request|connection (rejected|open)|server listening|Websocket地址/.test(line)) return "HTTP";
    if (/mcp/i.test(line)) return "MCP";
    if (/wake word detected|唤醒/.test(line)) return "WAKE";
    return "SYS";
  }

  function matches(frame) {
    if (!state.sources[frame.source]) return false;
    if (!state.levels[frame.level || "info"]) return false;
    const stage = classifyStage(frame.line);
    if (!state.stages.ALL && !state.stages[stage]) return false;
    if (state.search && frame.line.indexOf(state.search) === -1) return false;
    return true;
  }

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // 转义 + 高亮搜索词
  function buildHtml(text) {
    let html = esc(text);
    if (state.search) {
      const q = esc(state.search);
      html = html.split(q).join('<span class="hl">' + q + "</span>");
    }
    return html;
  }

  // 超长行(LLM 请求/响应全文)截断显示, 点击展开
  const TRUNC_LEN = 600;
  function truncate(full) {
    if (full.length <= TRUNC_LEN) return { shown: full, truncated: false };
    return { shown: full.slice(0, TRUNC_LEN) + " …(+" + (full.length - TRUNC_LEN) + "字符,点击展开)", truncated: true };
  }

  function renderFrame(frame) {
    const stage = classifyStage(frame.line);
    const line = document.createElement("div");
    line.className = "line";

    const src = document.createElement("span");
    src.className = "badge-src " + frame.source;
    src.textContent = frame.source;

    const lvl = document.createElement("span");
    lvl.className = "badge-lvl lvl-" + (frame.level || "info");
    lvl.textContent = (frame.level || "info").toUpperCase();

    const st = document.createElement("span");
    st.className = "badge-stage";
    st.textContent = stage;

    const txt = document.createElement("span");
    txt.className = "txt stage-" + stage;
    const full = frame.line;
    const { shown, truncated } = truncate(full);
    txt.innerHTML = buildHtml(shown);
    if (truncated) {
      txt.title = "点击展开/收起完整内容";
      txt.classList.add("trunc");
      txt.addEventListener("click", () => {
        const expanded = txt.classList.toggle("expanded");
        txt.innerHTML = buildHtml(expanded ? full : shown);
      });
    }

    line.appendChild(src);
    line.appendChild(lvl);
    line.appendChild(st);
    line.appendChild(txt);
    logEl.appendChild(line);

    while (logEl.childElementCount > MAX_LINES) {
      logEl.removeChild(logEl.firstChild);
    }
  }

  function flush() {
    state.timer = null;
    const frames = state.pending;
    state.pending = [];
    if (state.paused) return;
    for (const frame of frames) {
      state.total++;
      if (matches(frame)) {
        state.shown++;
        renderFrame(frame);
      }
    }
    statsEl.textContent = "显示 " + state.shown + " / 总数 " + state.total;
    // 只在"已经贴底"时自动跟到底部; 用户往上翻过则不打扰, 滚回底部后自动恢复
    if (state.autoScroll && isAtBottom()) {
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  function enqueue(frame) {
    state.pending.push(frame);
    if (!state.timer) state.timer = setTimeout(flush, FLUSH_MS);
  }

  function setStatus(text, ok) {
    statusEl.textContent = text;
    dotEl.classList.toggle("on", !!ok);
  }

  // ---------- WebSocket ----------
  function connect() {
    if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
    setStatus("连接中… " + wsUrl, false);
    const ws = new WebSocket(wsUrl);
    state.ws = ws;

    ws.onopen = () => setStatus("已连接 " + wsUrl, true);
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "logs_hello") {
        logEl.innerHTML = "";
        state.shown = 0;
        state.total = 0;
        document.getElementById("connInfo").textContent =
          "container=" + (msg.payload && msg.payload.container || "?") + " · history=" + (msg.payload && msg.payload.history || 0);
        return;
      }
      if (msg.source) enqueue(msg);
    };
    ws.onclose = () => {
      setStatus("已断开, 2s 后重连…", false);
      setTimeout(connect, 2000);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  // ---------- 控件 ----------
  document.getElementById("srcGroup").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-src]");
    if (!btn) return;
    state.sources[btn.dataset.src] = !state.sources[btn.dataset.src];
    btn.classList.toggle("on", state.sources[btn.dataset.src]);
  });

  document.getElementById("lvlGroup").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lvl]");
    if (!btn) return;
    state.levels[btn.dataset.lvl] = !state.levels[btn.dataset.lvl];
    btn.classList.toggle("on", state.levels[btn.dataset.lvl]);
  });

  document.getElementById("stageGroup").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-stage]");
    if (!btn) return;
    const s = btn.dataset.stage;
    if (s === "ALL") {
      const next = !state.stages.ALL;
      state.stages.ALL = next;
      btn.classList.toggle("on", next);
      document.querySelectorAll("#stageGroup .chip[data-stage]").forEach((b) => {
        if (b.dataset.stage !== "ALL") { state.stages[b.dataset.stage] = next; b.classList.toggle("on", next); }
      });
      return;
    }
    state.stages[s] = !state.stages[s];
    btn.classList.toggle("on", state.stages[s]);
    const allOn = Object.keys(state.stages).filter((k) => k !== "ALL").every((k) => state.stages[k]);
    state.stages.ALL = allOn;
    document.querySelector('#stageGroup .chip[data-stage="ALL"]').classList.toggle("on", allOn);
  });

  const searchEl = document.getElementById("search");
  searchEl.addEventListener("input", () => {
    state.search = searchEl.value.trim();
    logEl.innerHTML = "";
    state.shown = 0;
    statsEl.textContent = "显示 0 / 总数 " + state.total;
  });

  document.getElementById("pauseBtn").addEventListener("click", (e) => {
    state.paused = !state.paused;
    e.target.textContent = state.paused ? "▶ 继续" : "⏸ 暂停";
    e.target.classList.toggle("on", state.paused);
    if (!state.paused) flush();
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    logEl.innerHTML = "";
    state.shown = 0;
  });

  // 空格暂停/恢复自动滚动
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") {
      e.preventDefault();
      state.autoScroll = !state.autoScroll;
    }
  });

  logEl.addEventListener("scroll", () => {
    // 无需额外逻辑: flush 时按"是否贴底"决定是否自动滚动。
    // 用户往上翻 → 不再强制跟随; 滚回底部 → 自动恢复跟随。
  });

  connect();
})();
</script>
</body>
</html>
