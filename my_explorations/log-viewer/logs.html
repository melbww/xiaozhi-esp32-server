<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Logs · desk bot stack</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --info: #58a6ff;
    --debug: #6e7681;
    --warn: #d29922;
    --error: #f85149;
    --accent: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13px; display: flex; flex-direction: column;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f85149; }
  .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .sep { width: 1px; height: 20px; background: var(--border); }
  .group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .group-label { font-size: 11px; color: var(--muted); margin-right: 2px; }
  button, .chip, .tgl {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 9px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  button:hover, .chip:hover, .tgl:hover { border-color: var(--muted); }
  .chip.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .tgl.on { background: #2ea043; border-color: #2ea043; color: #fff; }
  .tgl.on.warn-on { background: #bd561d; border-color: #bd561d; }
  input[type=search] {
    background: #0d1117; border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 3px 8px; font-size: 12px; width: 160px; font-family: inherit;
  }
  input[type=search]:focus { outline: 1px solid var(--info); }
  .stats { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  #log {
    flex: 1; overflow-y: auto; padding: 6px 0;
  }
  .line {
    display: flex; align-items: baseline; gap: 8px;
    padding: 1px 12px; white-space: pre-wrap; word-break: break-all;
    border-bottom: 1px solid rgba(48,54,61,.25);
  }
  .line:hover { background: rgba(255,255,255,.03); }
  .badge-src {
    flex: none; font-size: 10px; padding: 0 6px; border-radius: 3px;
    color: #0d1117; font-weight: 600; min-width: 34px; text-align: center;
    background: #8b949e;
  }
  .badge-lvl {
    flex: none; font-size: 10px; padding: 0 5px; border-radius: 3px; min-width: 38px;
    text-align: center; border: 1px solid transparent;
  }
  .lvl-info { color: var(--info); border-color: rgba(88,166,255,.4); }
  .lvl-debug { color: var(--debug); border-color: rgba(110,118,129,.4); }
  .lvl-warn { color: var(--warn); border-color: rgba(210,153,34,.4); }
  .lvl-error { color: var(--error); border-color: rgba(248,81,73,.5); }
  .badge-stage {
    flex: none; font-size: 10px; padding: 0 5px; border-radius: 3px; min-width: 34px;
    text-align: center; background: #21262d; color: var(--muted);
  }
  .badge-time {
    flex: none; font-size: 10px; min-width: 54px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .line.formatted { align-items: flex-start; }
  .line.formatted .badge-src, .line.formatted .badge-lvl,
  .line.formatted .badge-stage, .line.formatted .badge-time,
  .line.formatted .badge-sess { margin-top: 1px; }
  .txt { flex: 1; min-width: 0; }
  .txt.trunc { cursor: pointer; }
  .txt.trunc:hover { outline: 1px dashed var(--muted); }
  .txt.trunc.expanded { background: rgba(88,166,255,.06); }
  .txt .hl { background: #d29922; color: #0d1117; border-radius: 2px; padding: 0 1px; }
  details.fmt { margin: 1px 0; }
  details.fmt > summary {
    cursor: pointer; color: var(--text); list-style: none;
  }
  details.fmt > summary::-webkit-details-marker { display: none; }
  details.fmt > summary::before {
    content: "▸"; display: inline-block; width: 12px; color: var(--muted);
  }
  details.fmt[open] > summary::before { content: "▾"; }
  details.fmt > summary:hover { color: var(--info); }
  .fmt-head { font-weight: 600; }
  .fmt-meta { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .fmt-body { margin: 6px 0 2px 12px; }
  .fmt-info { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .fmt-info .k { color: #79c0ff; margin-right: 2px; }
  .msgs { display: flex; flex-direction: column; gap: 6px; }
  .msg { border-left: 2px solid var(--border); padding-left: 8px; }
  .msg.system { border-color: #8b949e; }
  .msg.user { border-color: #58a6ff; }
  .msg.assistant { border-color: #d2a8ff; }
  .msg.tool { border-color: #3fb950; }
  .msg .role {
    display: block; font-size: 10px; text-transform: uppercase; color: var(--muted);
    letter-spacing: .04em; margin-bottom: 1px;
  }
  .msg .content, pre.json {
    margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere;
    font-family: inherit; font-size: 12px; line-height: 1.45;
  }
  pre.json {
    background: #0d1117; border: 1px solid var(--border); border-radius: 5px;
    padding: 7px 9px; max-height: 360px; overflow: auto;
  }
  details.msg.system { border-left-color: #8b949e; }
  details.msg.system > summary { cursor: pointer; color: var(--muted); font-size: 11px; }
  .line-photo { flex: none; display: inline-flex; align-self: center; margin-right: 8px; }
  .log-photo {
    /* Fixed 16:9 box: the browser reserves the space before the JPEG loads,
       so a late load cannot push the view away from the bottom. */
    width: 176px; height: 99px; object-fit: cover;
    border: 1px solid var(--border); border-radius: 4px;
    vertical-align: middle; background: #000;
  }
  .log-photo:hover { border-color: var(--info); }
  .txt.stage-VAD  { color: #79c0ff; }
  .txt.stage-ASR  { color: #7ee787; }
  .txt.stage-ASRRAW { color: #56d364; font-weight: 600; }
  .txt.stage-LLM  { color: #ffa657; }
  .txt.stage-TTS  { color: #d2a8ff; }
  .txt.stage-HTTP { color: #8b949e; }
  .txt.stage-ERROR { color: #f85149; }
  .txt.stage-WARN  { color: #d29922; }
  .badge-sess {
    flex: none; font-size: 10px; padding: 0 5px; border-radius: 3px; min-width: 58px;
    text-align: center; background: #11161d; border: 1px solid var(--border);
    color: var(--muted);
  }
  select {
    background: #0d1117; border: 1px solid var(--border); color: var(--text);
    border-radius: 5px; padding: 3px 6px; font-size: 12px; font-family: inherit;
    max-width: 330px;
  }
  select:focus { outline: 1px solid var(--info); }
  #log.grouped { padding: 8px 10px; }
  .sess {
    border: 1px solid var(--border); border-radius: 6px;
    margin: 0 0 8px; background: #10151c; overflow: hidden;
  }
  .sess-head {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; cursor: pointer; font-size: 12px;
    background: #161b22; user-select: none;
  }
  .sess-head:hover { background: #1b222b; }
  .sess.collapsed .sess-body { display: none; }
  .sess.collapsed .sess-caret { transform: rotate(-90deg); }
  .sess-caret { color: var(--muted); width: 10px; display: inline-block; }
  .sess-id { font-weight: 600; }
  .sess-dev { color: var(--muted); font-size: 11px; }
  .sess-meta { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .sess-body { padding: 2px 0; border-left: 2px solid rgba(88,166,255,.25); margin-left: 13px; }
  .sess-body .badge-sess { display: none; }
  #empty { color: var(--muted); text-align: center; padding: 40px; font-size: 12px; }
  /* 用户往上翻(不在底部)时出现的"回到最新"浮层按钮 */
  #jumpBottom {
    position: fixed; right: 18px; bottom: 46px; display: none; z-index: 10;
    background: #1f6feb; border-color: #1f6feb; color: #fff;
    border-radius: 999px; padding: 6px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  #jumpBottom.show { display: block; }
  footer {
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 4px 12px; font-size: 11px; color: var(--muted);
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
<header>
  <h1>📡 Live Logs</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
  <div class="sep"></div>
  <div class="group" id="srcGroup">
    <span class="group-label">源</span>
    <!-- source chips are built from the /logs-ws hello frame (see sources.json) -->
  </div>
  <div class="sep"></div>
  <div class="group" id="lvlGroup">
    <span class="group-label">级别</span>
    <button class="tgl on" data-lvl="debug">DEBUG</button>
    <button class="tgl on" data-lvl="info">INFO</button>
    <button class="tgl on" data-lvl="warn">WARN</button>
    <button class="tgl on" data-lvl="error">ERROR</button>
  </div>
  <div class="sep"></div>
  <div class="group" id="stageGroup">
    <span class="group-label">阶段</span>
    <button class="chip on" data-stage="ALL">ALL</button>
    <button class="chip on" data-stage="VAD">VAD</button>
    <button class="chip on" data-stage="ASR">ASR</button>
    <button class="chip on" data-stage="LLM">LLM</button>
    <button class="chip on" data-stage="TTS">TTS</button>
    <button class="chip on" data-stage="HTTP">HTTP</button>
    <button class="chip on" data-stage="MCP">MCP</button>
    <button class="chip on" data-stage="WAKE">WAKE</button>
    <button class="chip on" data-stage="SYS">SYS</button>
  </div>
  <div class="sep"></div>
  <div class="group" id="sessGroup">
    <span class="group-label">会话</span>
    <select id="sessSelect" title="按 session_id 过滤（显示会话开始时间；分组模式见右侧按钮）">
      <option value="">全部</option>
    </select>
    <button id="groupBtn" title="把同一会话的日志折叠到一起">👥 分组</button>
  </div>
  <div class="sep"></div>
  <input type="search" id="search" placeholder="🔍 关键字过滤…">
  <button id="pauseBtn">⏸ 暂停</button>
  <button id="clearBtn">🧹 清屏</button>
  <div class="stats" id="stats"></div>
</header>
<div id="log"></div>
<button id="jumpBottom" title="跳到最新日志并恢复自动滚动">⬇ 最新</button>
<footer>
  <span id="connInfo"></span>
  <span id="hint">提示: 说话后 [VAD]→[ASR]→[ASR][RAW]→[LLM]→[TTS] 会实时出现在这里</span>
</footer>

<script>
(function () {
  "use strict";

  // ---------- 状态 ----------
  const wsUrl = "ws://" + location.host + "/logs-ws";
  const MAX_FRAMES = 3000;
  const TRIM_CHUNK = 500;   // 缓冲满后一次丢这么多再整体重绘, 避免每帧都重绘
  const FLUSH_MS = 80;

  const state = {
    ws: null,
    sources: {},
    levels: { debug: true, info: true, warn: true, error: true },
    stages: { ALL: true, VAD: true, ASR: true, LLM: true, TTS: true, HTTP: true, MCP: true, WAKE: true, SYS: true },
    session: "",          // "" = 全部, "__none__" = 未归属, 否则是 session_id
    grouped: false,       // 按会话分块显示
    paused: false,
    autoScroll: true,
    search: "",
    total: 0,
    shown: 0,
    frames: [],           // 已收到的帧(过滤前), 用于切换过滤/分组后重绘
    sessions: {},         // id -> { id, device, first, last, count }
    blocks: {},           // session key -> { wrap, body, metaEl, count, first, last }
    pending: [],
    timer: null,
    recording: null,
  };

  const logEl = document.getElementById("log");
  const statsEl = document.getElementById("stats");
  const statusEl = document.getElementById("statusText");
  const dotEl = document.getElementById("dot");
  const jumpBtn = document.getElementById("jumpBottom");
  const sessSel = document.getElementById("sessSelect");
  const groupBtn = document.getElementById("groupBtn");
  const hintEl = document.getElementById("hint");
  const defaultHint = hintEl.textContent;
  const loadedSessions = new Set();
  let loadToken = 0;

  // 视为"贴底"的容差(px): 在这个范围内就认为用户在看最新内容
  const SCROLL_TOLERANCE = 24;
  function isAtBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight <= SCROLL_TOLERANCE;
  }
  function scrollToBottom() {
    logEl.scrollTop = logEl.scrollHeight;
  }
  // 不在底部时显示"回到最新"按钮
  function updateJumpHint() {
    jumpBtn.classList.toggle("show", !isAtBottom());
  }

  // ---------- 日志源(由服务端 hello 帧动态生成) ----------
  const SRC_COLORS = ["#58a6ff", "#d2a8ff", "#3fb950", "#ffa657", "#79c0ff", "#f85149"];
  const srcColor = {};

  function buildSources(list) {
    const group = document.getElementById("srcGroup");
    group.querySelectorAll("button[data-src]").forEach((b) => b.remove());
    Object.keys(state.sources).forEach((k) => delete state.sources[k]);

    (list || []).forEach((item, i) => {
      const name = typeof item === "string" ? item : item && item.name;
      if (!name) return;
      const label = typeof item === "string" ? name : (item.label || name);
      if (!(name in srcColor)) srcColor[name] = SRC_COLORS[i % SRC_COLORS.length];
      state.sources[name] = true;

      const btn = document.createElement("button");
      btn.className = "tgl on";
      btn.dataset.src = name;
      btn.textContent = name;
      btn.title = label + (item.target ? " · " + (item.kind || "") + " " + item.target : "");
      group.appendChild(btn);
    });
  }

  // ---------- 会话 ----------
  function sessionKey(frame) {
    return frame.session || "__none__";
  }
  function sessionLabel(id) {
    if (id === "__none__") return "未归属";
    const compact = String(id).replace(/-/g, "");
    return "#" + compact.slice(0, 8);
  }
  function sessionColor(id) {
    if (id === "__none__") return "#8b949e";
    let hash = 0;
    for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
    return "hsl(" + (Math.abs(hash) % 360) + ",65%,65%)";
  }
  function fmtTime(ts) {
    if (!ts) return "";
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString("zh-CN", { hour12: false });
  }
  // 会话启动时间用 "MM-DD HH:MM:SS"，跨天也能分清
  function fmtStart(ts) {
    if (!ts) return "";
    const d = new Date(ts * 1000);
    const p = (n) => String(n).padStart(2, "0");
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
      p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  // ---------- 日志行解析 / 格式化 ----------
  // loguru 控制台:  261114 17:20:36[0.9.8-...][logger]-INFO-message
  // loguru 文件:    2026-11-14 17:20:36 - 0.9.8-... - logger - INFO - message
  // 页面已经用 badge 显示时间/级别/阶段, 正文里不再重复这一长串前缀。
  const CONSOLE_PREFIX = /^(\d{6} \d{2}:\d{2}:\d{2})\[([^\]]*)\]\[([^\]]*)\]-([A-Z]+)-(.*)$/s;
  const FILE_PREFIX = /^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) - ([^-]+) - ([^-]+) - ([A-Z]+) - (.*)$/s;
  // Java (manager-api): 2026-11-14 00:00:13.954 [thread] DEBUG logger - message
  const JAVA_PREFIX = /^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \[([^\]]+)\] ([A-Z]+) ([^ ]+) - (.*)$/s;
  // Python runtime: 2026-11-01 17:23:41,665 [INFO] logger - message
  const RUNTIME_PREFIX = /^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \[([A-Z]+)\] ([^ ]+) - (.*)$/s;
  // Raw Python logging that bypasses loguru: 2026-11-14 16:50:15,926 [INFO] message
  const PY_LOG_PREFIX = /^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \[([A-Z]+)\] (.*)$/s;
  function parseLine(full) {
    let m = CONSOLE_PREFIX.exec(full);
    if (m) return { time: m[1].slice(-8), level: m[4].toLowerCase(), logger: m[3], message: m[5] };
    m = FILE_PREFIX.exec(full);
    if (m) return { time: m[1].slice(11), level: m[4].toLowerCase(), logger: m[3], message: m[5] };
    m = JAVA_PREFIX.exec(full);
    if (m) return { time: m[1].slice(11), level: m[3].toLowerCase(), logger: m[4], message: m[5] };
    m = RUNTIME_PREFIX.exec(full);
    if (m) return { time: m[1].slice(11), level: m[2].toLowerCase(), logger: m[3], message: m[4] };
    m = PY_LOG_PREFIX.exec(full);
    if (m) return { time: m[1].slice(11), level: m[2].toLowerCase(), logger: "", message: m[3] };
    return { time: "", level: "", logger: "", message: full };
  }
  function parsedOf(frame) {
    if (!frame._parsed) frame._parsed = parseLine(frame.line || "");
    return frame._parsed;
  }
  function oneLine(text, limit) {
    const s = String(text || "").replace(/\s+/g, " ").trim();
    return s.length > limit ? s.slice(0, limit - 1) + "…" : s;
  }

  // 找到从 start 开始的平衡 JSON 值(字符串/转义感知), 返回结束下标。
  function jsonEnd(text, start) {
    const open = text[start];
    const close = open === "{" ? "}" : "]";
    let depth = 0;
    let inStr = false;
    let esc = false;
    for (let i = start; i < text.length; i++) {
      const c = text[i];
      if (inStr) {
        if (esc) esc = false;
        else if (c === "\\") esc = true;
        else if (c === '"') inStr = false;
        continue;
      }
      if (c === '"') { inStr = true; continue; }
      if (c === open) depth++;
      else if (c === close) {
        depth--;
        if (depth === 0) return i;
      }
    }
    return -1;
  }
  // 只格式化"一直延伸到行尾"的 JSON, 避免把正文里的 [VAD] 之类误判成 JSON。
  function trailingJson(text) {
    const trimmed = text.replace(/\s+$/, "");
    for (let i = 0; i < trimmed.length; i++) {
      const ch = trimmed[i];
      if (ch !== "{" && ch !== "[") continue;
      const end = jsonEnd(trimmed, i);
      if (end !== trimmed.length - 1) continue;
      try {
        return { start: i, value: JSON.parse(trimmed.slice(i, end + 1)) };
      } catch (error) {}
    }
    return null;
  }
  function jsonDetail(value, text) {
    const lines = text.split("\n").length;
    if (Array.isArray(value)) return value.length + " 项 · " + lines + " 行";
    if (value && typeof value === "object") {
      return Object.keys(value).length + " 个键 · " + lines + " 行";
    }
    return lines + " 行";
  }

  // Python 纯字符串列表 ['a', 'b']（不 eval，只认单引号字符串）。
  function trailingPyList(text) {
    const trimmed = text.replace(/\s+$/, "");
    const start = trimmed.lastIndexOf("[");
    if (start === -1 || !trimmed.endsWith("]")) return null;
    const inner = trimmed.slice(start + 1, -1);
    if (inner.trim() !== "" &&
        !/^\s*(?:'[^']*'\s*,\s*)*'[^']*'\s*$/.test(inner)) {
      return null;
    }
    const items = [];
    const re = /'([^']*)'/g;
    let m;
    while ((m = re.exec(inner))) items.push(m[1]);
    return { start, value: items };
  }

  function contentText(content) {
    if (typeof content === "string") return content;
    if (Array.isArray(content)) {
      return content
        .map((part) => {
          if (typeof part === "string") return part;
          if (!part) return "";
          if (typeof part.text === "string") return part.text;
          if (part.type) return "[" + part.type + "]";
          return "";
        })
        .filter(Boolean)
        .join("\n");
    }
    if (content == null) return "";
    return JSON.stringify(content);
  }

  function buildLlmBody(messages, tools, model, url) {
    let html = '<div class="fmt-info">';
    if (model) html += '<span class="k">model</span> ' + esc(model) + " ";
    if (url) html += '<span class="k">endpoint</span> ' + esc(url) + " ";
    if (tools.length) {
      html += '<span class="k">tools</span> ' + tools.map((t) => esc(t)).join("、");
    }
    html += '</div><div class="msgs">';
    for (const msg of messages) {
      const role = String((msg && msg.role) || "?").toLowerCase();
      const content = contentText(msg && msg.content);
      const extra = Array.isArray(msg && msg.content)
        ? msg.content.filter((part) => part && typeof part.text !== "string")
        : [];
      if (role === "system" && content) {
        html += '<details class="msg system"><summary>system · ' +
          content.length + ' 字符</summary><pre class="content">' +
          buildHtml(content) + '</pre></details>';
        continue;
      }
      html += '<div class="msg ' + esc(role) + '"><span class="role">' +
        esc(role) + '</span><pre class="content">' +
        (content ? buildHtml(content) : "(empty)") + '</pre>';
      if (extra.length) {
        html += '<pre class="json">' +
          buildHtml(JSON.stringify(extra, null, 2)) + '</pre>';
      }
      if (msg && msg.tool_calls) {
        html += '<pre class="json">' +
          buildHtml(JSON.stringify(msg.tool_calls, null, 2)) + '</pre>';
      }
      html += '</div>';
    }
    return html + '</div>';
  }

  function formatLlmRequest(message) {
    const marker = "messages=";
    const markerAt = message.indexOf(marker);
    if (markerAt === -1) return null;
    const parsed = trailingJson(message.slice(markerAt + marker.length));
    if (!parsed || !Array.isArray(parsed.value)) return null;

    const messages = parsed.value;
    const before = message.slice(0, markerAt).replace(/\s+$/, "");
    let tools = [];
    const toolMatch = /tools=(\[[^\]]*\])/.exec(before);
    if (toolMatch) {
      try { tools = JSON.parse(toolMatch[1]); } catch (error) {}
    }
    const modelMatch = /\bmodel=([^\s]+)/.exec(before);
    const model = modelMatch ? modelMatch[1] : "";
    const urlMatch = /->\s*(\S+)/.exec(before);
    const url = urlMatch ? urlMatch[1] : "";

    let head = before;
    const cut = head.search(/\s+model=|\s+tools=/);
    if (cut !== -1) head = head.slice(0, cut);
    head = head.replace(/\s*->\s*\S+$/, "").trim();

    let lastUser = "";
    for (let i = messages.length - 1; i >= 0; i--) {
      const msg = messages[i];
      if (msg && msg.role === "user" && msg.content) {
        lastUser = contentText(msg.content);
        break;
      }
    }
    const meta = [];
    if (model) meta.push("model: " + model);
    if (tools.length) {
      const shown = tools.slice(0, 3).join(", ");
      meta.push("tools: " + shown + (tools.length > 3 ? " … (" + tools.length + ")" : ""));
    }
    meta.push(messages.length + " 条消息");
    if (lastUser) meta.push("user: " + oneLine(lastUser, 50));

    return {
      summary: '<span class="fmt-head">' + esc(oneLine(head || "LLM 请求", 80)) + '</span>' +
        '<span class="fmt-meta"> · ' + esc(meta.join(" · ")) + '</span>',
      full: () => buildLlmBody(messages, tools, model, url),
    };
  }

  function formatGenericJson(message) {
    const parsed = trailingJson(message) || trailingPyList(message);
    if (!parsed) return null;
    const text = JSON.stringify(parsed.value, null, 2);
    const before = message.slice(0, parsed.start).replace(/\s+$/, "");
    const label = before.replace(/\s*[:：]\s*$/, "");
    return {
      summary: '<span class="fmt-head">' + esc(label ? oneLine(label, 160) : "JSON") +
        '</span><span class="fmt-meta"> · ' + esc(jsonDetail(parsed.value, text)) + '</span>',
      full: () => '<pre class="json">' + buildHtml(text) + '</pre>',
    };
  }

  function formatFrameMessage(message) {
    if (!message) return null;
    if (message.indexOf("messages=") !== -1) {
      const llm = formatLlmRequest(message);
      if (llm) return llm;
    }
    const response = /^(LLM 响应(?:全文)?)[:：]\s*([\s\S]*)$/.exec(message);
    if (response) {
      const content = response[2];
      return {
        summary: '<span class="fmt-head">' + esc(response[1]) +
          '</span><span class="fmt-meta"> · ' + content.length + ' 字符</span>',
        full: () => '<pre class="content">' + buildHtml(content) + '</pre>',
      };
    }
    return formatGenericJson(message);
  }

  function formattedOf(frame, message) {
    if (frame._formatted === undefined) {
      frame._formatted = formatFrameMessage(message) || null;
    }
    return frame._formatted;
  }

  function buildSessionOptions(list) {
    if (list) {
      state.sessions = {};
      (list || []).forEach((meta) => {
        if (meta && meta.id) state.sessions[meta.id] = meta;
      });
    }
    const current = state.session;
    sessSel.innerHTML = "";
    sessSel.add(new Option("全部", ""));
    sessSel.add(new Option("未归属", "__none__"));
    Object.values(state.sessions)
      .sort((a, b) => (b.last || 0) - (a.last || 0))
      .forEach((meta) => {
        const start = fmtStart(meta.first);
        const opt = new Option(
          sessionLabel(meta.id) +
            (start ? " · " + start : "") +
            (meta.device ? " · " + meta.device : ""),
          meta.id
        );
        opt.title = meta.id +
          (start ? " · 开始 " + start : "") +
          (meta.last ? " · 最后 " + fmtStart(meta.last) : "") +
          (meta.device ? " · " + meta.device : "");
        sessSel.add(opt);
      });
    const keep = current === "__none__" || Object.prototype.hasOwnProperty.call(state.sessions, current);
    sessSel.value = keep ? current : "";
    state.session = sessSel.value;
  }

  function noteSession(frame) {
    if (!frame.session) return;
    const known = state.sessions[frame.session];
    if (!known) {
      state.sessions[frame.session] = {
        id: frame.session,
        device: frame.device || "",
        first: frame.ts,
        last: frame.ts,
      };
      buildSessionOptions();
      return;
    }
    known.last = frame.ts;
    if (frame.device) known.device = frame.device;
  }

  // ---------- 历史会话按需加载 ----------
  function setHint(text) {
    hintEl.textContent = text || defaultHint;
  }
  function frameKey(frame) {
    return (frame.source || "") + "\u0000" + (frame.ts || 0) + "\u0000" + (frame.line || "");
  }
  function dayStr(ts) {
    const d = new Date(ts * 1000);
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function sessionDays(meta) {
    let first = meta && meta.first;
    let last = meta && meta.last;
    if (!first && meta) {
      const own = state.frames.filter((f) => f.session === meta.id);
      if (own.length) { first = own[0].ts; last = own[own.length - 1].ts; }
    }
    if (!first) return [];
    const start = new Date(first * 1000);
    const end = new Date((last || first) * 1000);
    const days = [];
    const cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const limit = new Date(end.getFullYear(), end.getMonth(), end.getDate());
    while (cursor <= limit && days.length < 8) {
      days.push(dayStr(cursor.getTime() / 1000));
      cursor.setDate(cursor.getDate() + 1);
    }
    return days;
  }

  async function loadRecordedSession(meta) {
    if (!meta || !meta.id) return;
    const id = meta.id;
    const token = ++loadToken;
    const days = sessionDays(meta);
    const source = meta.source || "server";
    if (!days.length) {
      setHint("无法确定 " + sessionLabel(id) + " 的录制日期");
      return;
    }
    setHint("正在从录制加载 " + sessionLabel(id) + " …");
    const fetched = [];
    for (const day of days) {
      try {
        const url = "/api/recordings/" + encodeURIComponent(day) + "/" +
          encodeURIComponent(source) + "?session=" + encodeURIComponent(id) +
          "&limit=5000";
        const response = await fetch(url);
        if (!response.ok) continue;
        const text = await response.text();
        for (const line of text.split("\n")) {
          if (!line.trim()) continue;
          try { fetched.push(JSON.parse(line)); } catch (error) {}
        }
      } catch (error) {}
    }
    if (token !== loadToken) return;
    loadedSessions.add(id);

    const seen = new Set(state.frames.map(frameKey));
    let added = 0;
    for (const frame of fetched) {
      if (!frame || !frame.line) continue;
      const key = frameKey(frame);
      if (seen.has(key)) continue;
      seen.add(key);
      state.frames.push(frame);
      state.total++;
      added++;
      noteSession(frame);
    }
    state.frames.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    if (state.frames.length > MAX_FRAMES) {
      state.frames.splice(0, state.frames.length - MAX_FRAMES);
    }
    rerender();
    if (added) {
      logEl.scrollTop = 0;
      updateJumpHint();
      setHint("已加载 " + added + " 行历史会话 " + sessionLabel(id) + "（来自录制）");
    } else if (fetched.length) {
      setHint("会话 " + sessionLabel(id) + " 已在当前缓冲区中");
    } else {
      setHint("没有找到 " + sessionLabel(id) + " 的录制帧（可能已过保留期）");
    }
  }

  function ensureSelectedSessionLoaded() {
    const id = state.session;
    if (!id || id === "__none__") { setHint(""); return; }
    const meta = state.sessions[id];
    if (!meta) return;
    const have = state.frames.reduce((n, f) => n + (f.session === id ? 1 : 0), 0);
    const expected = meta.count || 0;
    if (have > 0 && (loadedSessions.has(id) || have >= expected)) return;
    if (have === 0) loadedSessions.delete(id);
    if (loadedSessions.has(id)) return;
    loadRecordedSession(meta);
  }

  // ---------- 阶段识别 ----------
  function classifyStage(line) {
    if (/\[ASR\]\[RAW\]/.test(line)) return "ASRRAW";
    if (/\[VAD\]/.test(line)) return "VAD";
    if (/\[ASR\]|识别文本|识别语言|识别情绪|识别说话人/.test(line)) return "ASR";
    if (/LLM 请求|LLM 响应|LLM 工具调用|大模型收到用户消息|Token 消耗|chat\/completions/.test(line)) return "LLM";
    if (/TTS|语音生成成功|发送音频消息|发送第一段语音/.test(line)) return "TTS";
    if (/HTTP Request|connection (rejected|open)|server listening|Websocket地址/.test(line)) return "HTTP";
    if (/mcp/i.test(line)) return "MCP";
    if (/wake word detected|唤醒/.test(line)) return "WAKE";
    return "SYS";
  }

  function matches(frame) {
    if (state.sources[frame.source] === false) return false;
    if (state.levels[frame.level || "info"] === false) return false;
    const parsed = parsedOf(frame);
    const text = parsed.message || frame.line;
    const stage = classifyStage(text);
    if (!state.stages.ALL && !state.stages[stage]) return false;
    if (state.search && text.indexOf(state.search) === -1) return false;
    if (state.session === "__none__") return !frame.session;
    if (state.session && frame.session !== state.session) return false;
    return true;
  }

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // 转义 + 高亮搜索词
  function buildHtml(text) {
    let html = esc(text);
    if (state.search) {
      const q = esc(state.search);
      html = html.split(q).join('<span class="hl">' + q + "</span>");
    }
    return html;
  }

  // 超长行(LLM 请求/响应全文)截断显示, 点击展开
  const TRUNC_LEN = 600;
  function truncate(full) {
    if (full.length <= TRUNC_LEN) return { shown: full, truncated: false };
    return { shown: full.slice(0, TRUNC_LEN) + " …(+" + (full.length - TRUNC_LEN) + "字符,点击展开)", truncated: true };
  }

  // ---------- 会话分块 ----------
  function blockFor(key) {
    const existing = state.blocks[key];
    if (existing) return existing;

    const meta = state.sessions[key] || {};
    const wrap = document.createElement("section");
    wrap.className = "sess";

    const head = document.createElement("div");
    head.className = "sess-head";

    const caret = document.createElement("span");
    caret.className = "sess-caret";
    caret.textContent = "▾";

    const idEl = document.createElement("span");
    idEl.className = "sess-id";
    idEl.textContent = sessionLabel(key);
    idEl.style.color = sessionColor(key);
    if (key !== "__none__") idEl.title = key;

    const devEl = document.createElement("span");
    devEl.className = "sess-dev";
    devEl.textContent = meta.device || "";

    const metaEl = document.createElement("span");
    metaEl.className = "sess-meta";

    head.appendChild(caret);
    head.appendChild(idEl);
    head.appendChild(devEl);
    head.appendChild(metaEl);
    head.addEventListener("click", () => wrap.classList.toggle("collapsed"));

    const body = document.createElement("div");
    body.className = "sess-body";

    wrap.appendChild(head);
    wrap.appendChild(body);
    logEl.appendChild(wrap);

    const block = { wrap, body, metaEl, count: 0, first: null, last: null };
    state.blocks[key] = block;
    return block;
  }

  function updateBlockMeta(block) {
    let span = "";
    if (block.first && block.last) {
      span = block.first === block.last ? block.first : block.first + " → " + block.last;
    }
    block.metaEl.textContent = block.count + " 行" + (span ? " · " + span : "");
  }

  function renderFrame(frame) {
    const parsed = parsedOf(frame);
    const message = parsed.message || frame.line;
    const stage = classifyStage(message);
    const level = frame.level || parsed.level || "info";
    const line = document.createElement("div");
    line.className = "line";

    // Capture before inserting: a photo that finishes loading later must not
    // leave the view a few pixels above the bottom.
    const follow = state.autoScroll && !state.paused && isAtBottom();

    const src = document.createElement("span");
    src.className = "badge-src";
    src.textContent = frame.source;
    src.style.background = srcColor[frame.source] || "#8b949e";

    const lvl = document.createElement("span");
    lvl.className = "badge-lvl lvl-" + level;
    lvl.textContent = level.toUpperCase();

    const st = document.createElement("span");
    st.className = "badge-stage";
    st.textContent = stage;

    const timeText = parsed.time || fmtTime(frame.ts);
    let timeEl = null;
    if (timeText) {
      timeEl = document.createElement("span");
      timeEl.className = "badge-time";
      timeEl.textContent = timeText;
      if (frame.ts) {
        timeEl.title = new Date(frame.ts * 1000).toLocaleString("zh-CN", { hour12: false });
      }
    }

    const txt = document.createElement("div");
    txt.className = "txt stage-" + stage;
    const formatted = formattedOf(frame, message);
    if (formatted) {
      line.classList.add("formatted");
      txt.innerHTML = '<details class="fmt"><summary>' + formatted.summary +
        '</summary><div class="fmt-body"></div></details>';
      const details = txt.querySelector("details");
      if (details) {
        details.addEventListener("toggle", () => {
          if (!details.open || details.dataset.built) return;
          details.dataset.built = "1";
          const body = details.querySelector(".fmt-body");
          if (body) body.innerHTML = formatted.full();
        });
      }
    } else {
      const { shown, truncated } = truncate(message);
      txt.innerHTML = buildHtml(shown);
      if (truncated) {
        txt.title = "点击展开/收起完整内容";
        txt.classList.add("trunc");
        txt.addEventListener("click", () => {
          const expanded = txt.classList.toggle("expanded");
          txt.innerHTML = buildHtml(expanded ? message : shown);
        });
      }
    }

    if (frame.photo) {
      const link = document.createElement("a");
      link.className = "line-photo";
      link.href = frame.photo;
      link.target = "_blank";
      link.rel = "noopener";
      link.title = "打开原图";
      const img = document.createElement("img");
      img.className = "log-photo";
      img.src = frame.photo;
      img.width = 176;
      img.height = 99;
      img.loading = "lazy";
      img.alt = "photo";
      img.addEventListener("load", () => {
        if (follow && state.autoScroll && !state.paused) scrollToBottom();
      });
      link.appendChild(img);
      line.appendChild(link);
    }

    line.appendChild(src);
    line.appendChild(lvl);
    line.appendChild(st);
    if (timeEl) line.appendChild(timeEl);

    if (frame.session) {
      const sess = document.createElement("span");
      sess.className = "badge-sess";
      sess.textContent = sessionLabel(frame.session);
      sess.style.color = sessionColor(frame.session);
      sess.title = frame.session + (frame.device ? " · " + frame.device : "");
      line.appendChild(sess);
    }

    line.appendChild(txt);

    if (state.grouped) {
      const block = blockFor(sessionKey(frame));
      block.body.appendChild(line);
      block.count++;
      const t = parsed.time || fmtTime(frame.ts);
      if (block.first == null && t) block.first = t;
      if (t) block.last = t;
      updateBlockMeta(block);
    } else {
      logEl.appendChild(line);
    }
  }

  function updateStats() {
    statsEl.textContent = "显示 " + state.shown + " / 总数 " + state.total;
  }

  // 过滤条件/分组模式变化后, 用缓冲帧整体重绘
  function rerender() {
    logEl.innerHTML = "";
    state.blocks = {};
    state.shown = 0;
    for (const frame of state.frames) {
      if (!matches(frame)) continue;
      state.shown++;
      renderFrame(frame);
    }
    updateStats();
    updateJumpHint();
  }

  function flush() {
    state.timer = null;
    const frames = state.pending;
    state.pending = [];
    if (!frames.length) return;

    const follow = state.autoScroll && !state.paused && isAtBottom();

    let trimmed = false;
    for (const frame of frames) {
      state.total++;
      state.frames.push(frame);
      noteSession(frame);
    }
    if (state.frames.length > MAX_FRAMES + TRIM_CHUNK) {
      state.frames.splice(0, state.frames.length - MAX_FRAMES);
      trimmed = true;
    }

    if (state.paused) {
      updateStats();
      return;
    }

    if (trimmed) {
      rerender();
    } else {
      for (const frame of frames) {
        if (!matches(frame)) continue;
        state.shown++;
        renderFrame(frame);
      }
      updateStats();
    }

    // 只在渲染前"已经贴底"时跟到底部; 用户往上翻过则不打扰, 滚回底部后自动恢复
    if (follow) scrollToBottom();
    updateJumpHint();
  }

  function enqueue(frame) {
    state.pending.push(frame);
    if (!state.timer) state.timer = setTimeout(flush, FLUSH_MS);
  }

  function setStatus(text, ok) {
    statusEl.textContent = text;
    dotEl.classList.toggle("on", !!ok);
  }

  function connInfoText(payload) {
    const names = Object.keys(state.sources).join(", ") || "?";
    let text = "sources=" + names + " · history=" + (payload.history || 0);
    text += " · 会话=" + Object.keys(state.sessions).length;
    text += " · 录制=" + (state.recording && state.recording.enabled ? "on" : "off");
    return text;
  }

  // ---------- WebSocket ----------
  function connect() {
    if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
    setStatus("连接中… " + wsUrl, false);
    const ws = new WebSocket(wsUrl);
    state.ws = ws;

    ws.onopen = () => setStatus("已连接 " + wsUrl, true);
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "logs_hello") {
        const payload = msg.payload || {};
        state.recording = payload.recording || null;
        loadToken++;
        loadedSessions.clear();
        setHint("");
        buildSources(payload.sources);
        buildSessionOptions(payload.sessions || []);
        if (wantSession) {
          state.session = wantSession;
          sessSel.value = wantSession;
          if (!sessSel.value) state.session = "";
          wantSession = "";
        }
        state.total = 0;
        state.shown = 0;
        state.frames = [];
        state.pending = [];
        if (state.timer) { clearTimeout(state.timer); state.timer = null; }
        logEl.innerHTML = "";
        state.blocks = {};
        updateStats();
        updateJumpHint();
        document.getElementById("connInfo").textContent = connInfoText(payload);
        if (state.session && state.session !== "__none__") {
          setTimeout(ensureSelectedSessionLoaded, 50);
        }
        return;
      }
      if (msg.source) enqueue(msg);
    };
    ws.onclose = () => {
      setStatus("已断开, 2s 后重连…", false);
      setTimeout(connect, 2000);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  // ---------- 控件 ----------
  document.getElementById("srcGroup").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-src]");
    if (!btn) return;
    state.sources[btn.dataset.src] = !state.sources[btn.dataset.src];
    btn.classList.toggle("on", state.sources[btn.dataset.src]);
    rerender();
  });

  document.getElementById("lvlGroup").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lvl]");
    if (!btn) return;
    state.levels[btn.dataset.lvl] = !state.levels[btn.dataset.lvl];
    btn.classList.toggle("on", state.levels[btn.dataset.lvl]);
    rerender();
  });

  document.getElementById("stageGroup").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-stage]");
    if (!btn) return;
    const s = btn.dataset.stage;
    if (s === "ALL") {
      const next = !state.stages.ALL;
      state.stages.ALL = next;
      btn.classList.toggle("on", next);
      document.querySelectorAll("#stageGroup .chip[data-stage]").forEach((b) => {
        if (b.dataset.stage !== "ALL") { state.stages[b.dataset.stage] = next; b.classList.toggle("on", next); }
      });
    } else {
      state.stages[s] = !state.stages[s];
      btn.classList.toggle("on", state.stages[s]);
      const allOn = Object.keys(state.stages).filter((k) => k !== "ALL").every((k) => state.stages[k]);
      state.stages.ALL = allOn;
      document.querySelector('#stageGroup .chip[data-stage="ALL"]').classList.toggle("on", allOn);
    }
    rerender();
  });

  sessSel.addEventListener("change", () => {
    state.session = sessSel.value;
    rerender();
    if (!state.session || state.session === "__none__") setHint("");
    else ensureSelectedSessionLoaded();
  });

  groupBtn.addEventListener("click", () => {
    state.grouped = !state.grouped;
    groupBtn.classList.toggle("on", state.grouped);
    logEl.classList.toggle("grouped", state.grouped);
    rerender();
  });

  const searchEl = document.getElementById("search");
  let searchTimer = null;
  searchEl.addEventListener("input", () => {
    state.search = searchEl.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(rerender, 150);
  });

  document.getElementById("pauseBtn").addEventListener("click", (e) => {
    state.paused = !state.paused;
    e.target.textContent = state.paused ? "▶ 继续" : "⏸ 暂停";
    e.target.classList.toggle("on", state.paused);
    if (!state.paused) rerender();
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    loadToken++;
    loadedSessions.clear();
    state.frames = [];
    state.total = 0;
    setHint("");
    rerender();
  });

  // 空格暂停/恢复自动滚动
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.code === "Space") {
      e.preventDefault();
      state.autoScroll = !state.autoScroll;
      // 重新开启时立刻跳到最新, 否则"开启"看起来没反应
      if (state.autoScroll) scrollToBottom();
      updateJumpHint();
    }
  });

  logEl.addEventListener("scroll", updateJumpHint);

  jumpBtn.addEventListener("click", () => {
    state.autoScroll = true;
    scrollToBottom();
    updateJumpHint();
  });

  // 支持直接打开 #group 进入会话分组视图, #session=<id> 直达某个会话
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
  let wantSession = hashParams.get("session") || "";
  if (hashParams.has("group") || location.hash.indexOf("group") !== -1) {
    state.grouped = true;
    groupBtn.classList.add("on");
    logEl.classList.add("grouped");
  }

  connect();
})();

</script>
</body>
</html>
